<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Voice Health Guidance Bot</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #000;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            padding: 0 20px;
            box-sizing: border-box;
            animation: fadeIn 1s ease-out;
        }

        h2 {
            font-weight: 300;
            margin-bottom: 40px;
            text-align: center;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .input-wrapper {
            display: flex;
            width: 100%;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
            position: relative;
        }

        .input-wrapper::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #000;
            transition: width 0.3s ease;
        }

        .input-wrapper:focus-within::after {
            width: 100%;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1rem;
            padding: 5px 10px;
            background: transparent;
            font-family: inherit;
        }

        input::placeholder {
            color: #b0b0b0;
            font-weight: 300;
        }

        button {
            background-color: transparent;
            border: 2px solid #000;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            padding: 12px;
            color: #000;
            transition: all 0.3s ease;
            margin-top: 10px;
            border-radius: 25px;
        }

        button:hover {
            background-color: #000;
            color: #fff;
        }

        .error {
            color: #d93025;
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Authentication Required</h2>

        <form method="POST">
            <div class="input-wrapper">
                <input type="text" name="user_id" placeholder="User ID" required>
            </div>
            <div class="input-wrapper">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>

</body>

</html>
