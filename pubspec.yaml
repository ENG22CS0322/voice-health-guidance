name: voice_health_app
description: A production-quality rural healthcare guidance Flutter application.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  provider: ^6.1.1
  animate_do: ^3.3.4
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5
  http: ^1.6.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/app_icon.png"
  android_12:
    image: "assets/icon/app_icon.png"
    color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/app_icon.png
